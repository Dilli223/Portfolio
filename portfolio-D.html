<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  
  <!-- SEO Meta Tags -->
  <title>Dilli Babu A | Portfolio - Electronics & Communication Engineer & Developer</title>
  <meta name="description" content="Professional portfolio of Dilli Babu A, an Electronics and Communication Engineering student and developer skilled in Java, SQL, LabView, and deep learning." />
  
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  
  <!-- React & ReactDOM CDN -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  
  <!-- Babel CDN for client-side JSX parsing (runs locally without CORS blocks) -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <!-- Embedded Premium Styling System -->
  <style>
    :root {
      --font-heading: 'Outfit', sans-serif;
      --font-body: 'Inter', sans-serif;

      --hue: 220; /* Default Accent Hue (Blue) */
      --primary: hsl(var(--hue), 85%, 55%);
      --primary-hover: hsl(var(--hue), 85%, 45%);
      --primary-light: hsl(var(--hue), 100%, 96%);
      
      --bg-app: #f8fafc;
      --bg-card: #ffffff;
      --bg-nav: rgba(255, 255, 255, 0.85);
      
      --text-primary: #0f172a;
      --text-secondary: #475569;
      --text-muted: #94a3b8;
      
      --border-color: #e2e8f0;
      --border-hover: hsl(var(--hue), 85%, 90%);
      
      --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
      --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -2px rgba(0, 0, 0, 0.1);
      --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -4px rgba(0, 0, 0, 0.1);
      --shadow-xl: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 8px 10px -6px rgba(0, 0, 0, 0.1);
      
      --glass-bg: rgba(255, 255, 255, 0.7);
      --glass-border: rgba(255, 255, 255, 0.4);
      
      --border-radius-sm: 8px;
      --border-radius-md: 16px;
      --border-radius-lg: 24px;
      
      --transition-fast: 0.2s ease;
      --transition-normal: 0.3s ease;
      --transition-slow: 0.5s ease;
      
      --header-height: 80px;
    }

    [data-theme="dark"] {
      --bg-app: #0b0f19;
      --bg-card: #131c2e;
      --bg-nav: rgba(11, 15, 25, 0.85);
      
      --primary-light: hsl(var(--hue), 30%, 15%);
      
      --text-primary: #f8fafc;
      --text-secondary: #94a3b8;
      --text-muted: #64748b;
      
      --border-color: #1e293b;
      --border-hover: hsl(var(--hue), 40%, 25%);
      
      --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.5);
      --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.3), 0 2px 4px -2px rgba(0, 0, 0, 0.3);
      --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.4), 0 4px 6px -4px rgba(0, 0, 0, 0.4);
      --shadow-xl: 0 20px 25px -5px rgba(0, 0, 0, 0.5), 0 8px 10px -6px rgba(0, 0, 0, 0.5);
      
      --glass-bg: rgba(19, 28, 46, 0.8);
      --glass-border: rgba(30, 41, 59, 0.5);
    }

    /* Base resets */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      scroll-behavior: smooth;
      font-size: 16px;
    }

    body {
      font-family: var(--font-body);
      background-color: var(--bg-app);
      color: var(--text-secondary);
      line-height: 1.6;
      overflow-x: hidden;
      transition: background-color var(--transition-normal), color var(--transition-normal);
    }

    h1, h2, h3, h4, h5, h6 {
      font-family: var(--font-heading);
      color: var(--text-primary);
      font-weight: 700;
      line-height: 1.25;
    }

    a {
      color: var(--primary);
      text-decoration: none;
      transition: color var(--transition-fast);
    }

    a:hover {
      color: var(--primary-hover);
    }

    ul {
      list-style: none;
    }

    img {
      max-width: 100%;
      height: auto;
      display: block;
    }

    /* Custom Scrollbar */
    ::-webkit-scrollbar {
      width: 10px;
    }

    ::-webkit-scrollbar-track {
      background: var(--bg-app);
    }

    ::-webkit-scrollbar-thumb {
      background: var(--border-color);
      border-radius: var(--border-radius-sm);
      border: 2px solid var(--bg-app);
    }

    ::-webkit-scrollbar-thumb:hover {
      background: var(--text-muted);
    }

    /* General Layout Utilities */
    .container {
      max-width: 95%;
      margin: 0 auto;
      padding: 0 2rem;
    }

    .section {
      padding: 6rem 0;
      position: relative;
    }

    .section-title-wrapper {
      margin-bottom: 3.5rem;
      text-align: center;
    }

    .section-title {
      font-size: 2.25rem;
      font-weight: 800;
      position: relative;
      display: inline-block;
      margin-bottom: 0.5rem;
      text-transform: capitalize;
    }

    .section-title::after {
      content: '';
      position: absolute;
      bottom: -8px;
      left: 50%;
      transform: translateX(-50%);
      width: 60px;
      height: 4px;
      background-color: var(--primary);
      border-radius: 2px;
      transition: background-color var(--transition-normal);
    }

    .section-subtitle {
      font-size: 1rem;
      color: var(--text-muted);
      max-width: 600px;
      margin: 0.5rem auto 0;
    }

    /* Buttons */
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      padding: 0.8rem 1.6rem;
      border-radius: 9999px;
      font-family: var(--font-heading);
      font-weight: 600;
      font-size: 0.95rem;
      cursor: pointer;
      transition: all var(--transition-fast);
      border: none;
      outline: none;
    }

    .btn-primary {
      background-color: var(--primary);
      color: #ffffff !important;
    }

    .btn-primary:hover {
      background-color: var(--primary-hover);
      transform: translateY(-2px);
      box-shadow: 0 8px 20px -6px hsl(var(--hue), 85%, 55%);
    }

    .btn-secondary {
      background-color: transparent;
      color: var(--text-primary) !important;
      border: 2px solid var(--border-color);
    }

    .btn-secondary:hover {
      background-color: var(--primary-light);
      border-color: var(--primary);
      transform: translateY(-2px);
    }

    /* Cards */
    .card {
      background-color: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: var(--border-radius-md);
      padding: 2rem;
      box-shadow: var(--shadow-sm);
      transition: transform var(--transition-normal), box-shadow var(--transition-normal), border-color var(--transition-normal);
    }

    .card:hover {
      transform: translateY(-6px);
      box-shadow: var(--shadow-xl);
      border-color: var(--border-hover);
    }

    /* Badges / Tags */
    .tag {
      display: inline-flex;
      align-items: center;
      font-size: 0.78rem;
      font-weight: 600;
      padding: 0.3rem 0.8rem;
      border-radius: 9999px;
      background-color: var(--primary-light);
      color: var(--primary);
      border: 1px solid hsl(var(--hue), 85%, 90%);
      transition: all var(--transition-fast);
    }

    [data-theme="dark"] .tag {
      border-color: hsl(var(--hue), 30%, 25%);
    }

    .tag:hover {
      background-color: var(--primary);
      color: #ffffff;
      border-color: var(--primary);
    }

    /* Timeline */
    .timeline {
      position: relative;
      max-width: 800px;
      margin: 0 auto;
      padding-left: 2rem;
      border-left: 2px solid var(--border-color);
    }

    .timeline-item {
      position: relative;
      margin-bottom: 3rem;
    }

    .timeline-item:last-child {
      margin-bottom: 0;
    }

    .timeline-marker {
      position: absolute;
      left: -2rem;
      top: 6px;
      width: 16px;
      height: 16px;
      border-radius: 50%;
      background-color: var(--bg-app);
      border: 3px solid var(--primary);
      transform: translateX(-50%);
      z-index: 10;
      transition: background-color var(--transition-fast);
    }

    .timeline-item:hover .timeline-marker {
      background-color: var(--primary);
    }

    .timeline-content {
      background-color: var(--bg-card);
      padding: 1.5rem;
      border-radius: var(--border-radius-md);
      border: 1px solid var(--border-color);
      box-shadow: var(--shadow-sm);
      transition: all var(--transition-normal);
    }

    .timeline-item:hover .timeline-content {
      box-shadow: var(--shadow-lg);
      border-color: var(--border-hover);
      transform: translateX(5px);
    }

    .timeline-date {
      font-family: var(--font-heading);
      font-size: 0.85rem;
      font-weight: 700;
      color: var(--primary);
      margin-bottom: 0.5rem;
    }

    /* Animation Keyframes */
    @keyframes fadeInUp {
      from {
        opacity: 0;
        transform: translateY(30px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes float {
      0% { transform: translateY(0px); }
      50% { transform: translateY(-10px); }
      100% { transform: translateY(0px); }
    }

    .animate-fade-in-up {
      animation: fadeInUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    .animate-float {
      animation: float 4s ease-in-out infinite;
    }

    @keyframes blink {
      50% { border-color: transparent }
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <!-- React Code using Babel parsing -->
  <script type="text/babel">
    const HUES = [
      { name: 'Blue', value: 220, hex: '#2563eb' },
      { name: 'Purple', value: 270, hex: '#7c3aed' },
      { name: 'Emerald', value: 150, hex: '#059669' },
      { name: 'Orange', value: 25, hex: '#ea580c' },
      { name: 'Crimson', value: 345, hex: '#db2777' },
    ];

    const WORDS = [
      'Electronics & Communication Engineer',
      'Python Developer',
      'SQL & Database Enthusiast',
      'AI & Deep Learning Builder',
    ];

    // ==========================================
    // NAVBAR COMPONENT
    // ==========================================
    function Navbar({ theme, toggleTheme, activeSection }) {
      const [isOpen, setIsOpen] = React.useState(false);
      const [isScrolled, setIsScrolled] = React.useState(false);
      const [currentHue, setCurrentHue] = React.useState(220);
      const [showColorPicker, setShowColorPicker] = React.useState(false);

      React.useEffect(() => {
        const handleScroll = () => {
          setIsScrolled(window.scrollY > 20);
        };
        window.addEventListener('scroll', handleScroll);
        return () => window.removeEventListener('scroll', handleScroll);
      }, []);

      const changeHue = (hueVal) => {
        setCurrentHue(hueVal);
        document.documentElement.style.setProperty('--hue', hueVal);
      };

      const navItems = [
        { id: 'hero', label: 'Home' },
        { id: 'about', label: 'About' },
        { id: 'skills', label: 'Skills' },
        { id: 'experience', label: 'Experience' },
        { id: 'projects', label: 'Projects' },
        { id: 'certifications', label: 'Certifications' },
        { id: 'achievements', label: 'Achievements' },
        { id: 'contact', label: 'Contact' },
      ];

      return (
        <nav style={{
          position: 'fixed',
          top: 0,
          left: 0,
          width: '100%',
          height: 'var(--header-height)',
          backgroundColor: isScrolled ? 'var(--bg-nav)' : 'transparent',
          backdropFilter: isScrolled ? 'blur(12px)' : 'none',
          borderBottom: isScrolled ? '1px solid var(--border-color)' : 'none',
          zIndex: 1000,
          transition: 'background-color var(--transition-normal), border var(--transition-normal)',
          display: 'flex',
          alignItems: 'center',
        }}>
          <div className="container" style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', width: '100%' }}>
            <a href="#hero" style={{ fontFamily: 'var(--font-heading)', fontWeight: 800, fontSize: '1.4rem', color: 'var(--text-primary)', display: 'flex', alignItems: 'center', gap: '0.4rem' }}>
              Dilli Babu<span style={{ color: 'var(--primary)' }}>.</span>
            </a>

            <div style={{ display: 'flex', alignItems: 'center', gap: '1.5rem' }} className="desktop-menu">
              <ul style={{ display: 'flex', gap: '1.5rem' }}>
                {navItems.map((item) => (
                  <li key={item.id}>
                    <a
                      href={`#${item.id}`}
                      style={{
                        fontSize: '0.9rem',
                        fontWeight: 600,
                        color: activeSection === item.id ? 'var(--primary)' : 'var(--text-secondary)',
                        position: 'relative',
                        padding: '0.5rem 0',
                      }}
                    >
                      {item.label}
                      {activeSection === item.id && (
                        <span style={{ position: 'absolute', bottom: 0, left: 0, width: '100%', height: '2px', backgroundColor: 'var(--primary)', borderRadius: '1px' }} />
                      )}
                    </a>
                  </li>
                ))}
              </ul>

              <div style={{ display: 'flex', alignItems: 'center', gap: '0.8rem', borderLeft: '1px solid var(--border-color)', paddingLeft: '0.8rem' }}>
                <div style={{ position: 'relative' }}>
                  <button
                    onClick={() => setShowColorPicker(!showColorPicker)}
                    style={{ background: 'none', border: 'none', cursor: 'pointer', color: 'var(--text-primary)', display: 'flex', alignItems: 'center', padding: '0.4rem', borderRadius: '50%' }}
                    title="Theme Colors"
                  >
                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M12 22C17.5228 22 22 17.5228 22 12C22 6.47715 17.5228 2 12 2C6.47715 2 2 6.47715 2 12C2 14.7255 3.09032 17.1962 4.85857 19C5.03457 19.176 5.28257 19.248 5.51857 19.192C5.75457 19.136 5.93857 18.96 5.98657 18.72C6.38657 16.72 8.13457 15.2 10.2386 15.2H13.7626C15.8666 15.2 17.6146 16.72 18.0146 18.72C18.0626 18.96 18.2466 19.136 18.4826 19.192C18.7186 19.248 18.9666 19.176 19.1426 19C20.9108 17.1962 22 14.7255 22 12"/><path d="M7.5 10.5C8.32843 10.5 9 9.82843 9 9C9 8.17157 8.32843 7.5 7.5 7.5C6.67157 7.5 6 8.17157 6 9C6 9.82843 6.67157 10.5 7.5 10.5Z"/><path d="M16.5 10.5C17.3284 10.5 18 9.82843 18 9C18 8.17157 17.3284 7.5 16.5 7.5C15.6716 7.5 15 8.17157 15 9C15 9.82843 15.6716 10.5 16.5 10.5Z"/><path d="M12 14C12.8284 14 13.5 13.3284 13.5 12.5C13.5 11.6716 12.8284 11 12 11C11.1716 11 10.5 11.6716 10.5 12.5C10.5 13.3284 11.1716 14 12 14Z"/></svg>
                  </button>

                  {showColorPicker && (
                    <div style={{
                      position: 'absolute',
                      top: '120%',
                      right: 0,
                      backgroundColor: 'var(--bg-card)',
                      border: '1px solid var(--border-color)',
                      borderRadius: 'var(--border-radius-sm)',
                      padding: '0.6rem',
                      boxShadow: 'var(--shadow-lg)',
                      display: 'flex',
                      gap: '0.5rem',
                      zIndex: 1010,
                    }}>
                      {HUES.map((h) => (
                        <button
                          key={h.name}
                          onClick={() => {
                            changeHue(h.value);
                            setShowColorPicker(false);
                          }}
                          style={{
                            width: '20px',
                            height: '20px',
                            borderRadius: '50%',
                            backgroundColor: h.hex,
                            border: currentHue === h.value ? '2px solid var(--text-primary)' : '1px solid rgba(0,0,0,0.1)',
                            cursor: 'pointer',
                            padding: 0,
                          }}
                          title={h.name}
                        />
                      ))}
                    </div>
                  )}
                </div>

                <button
                  onClick={toggleTheme}
                  style={{ background: 'none', border: 'none', cursor: 'pointer', color: 'var(--text-primary)', display: 'flex', alignItems: 'center', padding: '0.4rem', borderRadius: '50%' }}
                  title={theme === 'dark' ? 'Light Mode' : 'Dark Mode'}
                >
                  {theme === 'dark' ? (
                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2"/><path d="M12 20v2"/><path d="m4.93 4.93 1.41 1.41"/><path d="m17.66 17.66 1.41 1.41"/><path d="M2 12h2"/><path d="M20 12h2"/><path d="m6.34 17.66-1.41 1.41"/><path d="m19.07 4.93-1.41 1.41"/></svg>
                  ) : (
                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/></svg>
                  )}
                </button>
              </div>
            </div>

            <div style={{ display: 'none' }} className="mobile-menu-toggle">
              <button
                onClick={() => setIsOpen(!isOpen)}
                style={{ background: 'none', border: 'none', cursor: 'pointer', color: 'var(--text-primary)', display: 'flex', alignItems: 'center' }}
              >
                {isOpen ? (
                  <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
                ) : (
                  <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><line x1="4" x2="20" y1="12" y2="12"/><line x1="4" x2="20" y1="6" y2="6"/><line x1="4" x2="20" y1="18" y2="18"/></svg>
                )}
              </button>
            </div>
          </div>

          {isOpen && (
            <div style={{
              position: 'fixed',
              top: 'var(--header-height)',
              left: 0,
              width: '100%',
              backgroundColor: 'var(--bg-card)',
              borderBottom: '1px solid var(--border-color)',
              padding: '1.5rem',
              display: 'flex',
              flexDirection: 'column',
              gap: '1rem',
              zIndex: 999,
              boxShadow: 'var(--shadow-lg)',
            }} className="mobile-drawer">
              <ul style={{ display: 'flex', flexDirection: 'column', gap: '1rem' }}>
                {navItems.map((item) => (
                  <li key={item.id}>
                    <a
                      href={`#${item.id}`}
                      onClick={() => setIsOpen(false)}
                      style={{ fontSize: '1rem', fontWeight: 600, color: activeSection === item.id ? 'var(--primary)' : 'var(--text-secondary)', display: 'block' }}
                    >
                      {item.label}
                    </a>
                  </li>
                ))}
              </ul>

              <div style={{ borderTop: '1px solid var(--border-color)', paddingTop: '1rem', display: 'flex', justifyContent: 'space-between', alignItems: 'center' }}>
                <div style={{ display: 'flex', gap: '0.6rem' }}>
                  {HUES.map((h) => (
                    <button
                      key={h.name}
                      onClick={() => changeHue(h.value)}
                      style={{
                        width: '24px',
                        height: '24px',
                        borderRadius: '50%',
                        backgroundColor: h.hex,
                        border: currentHue === h.value ? '2px solid var(--text-primary)' : '1px solid rgba(0,0,0,0.1)',
                        cursor: 'pointer',
                        padding: 0,
                      }}
                      title={h.name}
                    />
                  ))}
                </div>

                <button
                  onClick={() => { toggleTheme(); setIsOpen(false); }}
                  style={{ background: 'none', border: 'none', cursor: 'pointer', color: 'var(--text-primary)', display: 'flex', alignItems: 'center', gap: '0.5rem', fontSize: '0.9rem', fontWeight: 600 }}
                >
                  {theme === 'dark' ? 'Light Mode' : 'Dark Mode'}
                </button>
              </div>
            </div>
          )}

          <style>{`
            @media (max-width: 768px) {
              .desktop-menu { display: none !important; }
              .mobile-menu-toggle { display: block !important; }
            }
          `}</style>
        </nav>
      );
    }

    // ==========================================
    // HERO COMPONENT
    // ==========================================
    function Hero() {
      const [index, setIndex] = React.useState(0);
      const [subIndex, setSubIndex] = React.useState(0);
      const [reverse, setReverse] = React.useState(false);
      const [text, setText] = React.useState('');

      React.useEffect(() => {
        if (subIndex === WORDS[index].length + 1 && !reverse) {
          const timeout = setTimeout(() => setReverse(true), 1500);
          return () => clearTimeout(timeout);
        }

        if (subIndex === 0 && reverse) {
          setReverse(false);
          setIndex((prev) => (prev + 1) % WORDS.length);
          return;
        }

        const timeout = setTimeout(() => {
          setSubIndex((prev) => prev + (reverse ? -1 : 1));
        }, reverse ? 40 : 80);

        return () => clearTimeout(timeout);
      }, [subIndex, reverse, index]);

      React.useEffect(() => {
        setText(WORDS[index].substring(0, subIndex));
      }, [subIndex, index]);

      return (
        <section id="hero" style={{ minHeight: '100vh', display: 'flex', alignItems: 'center', paddingTop: 'var(--header-height)', position: 'relative', overflow: 'hidden' }}>
          <div style={{ position: 'absolute', top: '20%', right: '-10%', width: '400px', height: '400px', borderRadius: '50%', background: 'radial-gradient(circle, hsl(var(--hue), 85%, 55%, 0.15) 0%, transparent 70%)', filter: 'blur(50px)', zIndex: 0, pointerEvents: 'none' }} className="animate-float" />
          <div style={{ position: 'absolute', bottom: '10%', left: '-10%', width: '350px', height: '350px', borderRadius: '50%', background: 'radial-gradient(circle, hsl(var(--hue), 85%, 55%, 0.1) 0%, transparent 70%)', filter: 'blur(40px)', zIndex: 0, pointerEvents: 'none' }} />

          <div className="container" style={{ position: 'relative', zIndex: 1, width: '100%' }}>

    // ==========================================
    // CONTACT COMPONENT
    // ==========================================
    function Contact() {
      const [formData, setFormData] = React.useState({ name: '', email: '', subject: '', message: '' });
      const [errors, setErrors] = React.useState({});
      const [isSubmitting, setIsSubmitting] = React.useState(false);
      const [submitStatus, setSubmitStatus] = React.useState(null);

      const validate = () => {
        let tempErrors = {};
        if (!formData.name.trim()) tempErrors.name = 'Name is required';
        if (!formData.email.trim()) {
          tempErrors.email = 'Email is required';
        } else if (!/\S+@\S+\.\S+/.test(formData.email)) {
          tempErrors.email = 'Email is invalid';
        }
        if (!formData.subject.trim()) tempErrors.subject = 'Subject is required';
        if (!formData.message.trim()) tempErrors.message = 'Message is required';
        setErrors(tempErrors);
        return Object.keys(tempErrors).length === 0;
      };

      const handleChange = (e) => {
        const { name, value } = e.target;
        setFormData({ ...formData, [name]: value });
        if (errors[name]) setErrors({ ...errors, [name]: '' });
      };

      const handleSubmit = (e) => {
        e.preventDefault();
        if (!validate()) return;
        setIsSubmitting(true);
        setTimeout(() => {
          setIsSubmitting(false);
          setSubmitStatus('success');
          setFormData({ name: '', email: '', subject: '', message: '' });
          setTimeout(() => setSubmitStatus(null), 5000);
        }, 1500);
      };

      return (
        <section id="contact" className="section" style={{ backgroundColor: 'var(--bg-card)', transition: 'background-color var(--transition-normal)' }}>
          <div className="container">
            <div className="section-title-wrapper">
              <h2 className="section-title">Contact Me</h2>
              <p className="section-subtitle">Feel free to reach out for opportunities or collaborations</p>
            </div>

            <div style={{ display: 'grid', gridTemplateColumns: '0.8fr 1.2fr', gap: '3.5rem', alignItems: 'start' }} className="contact-grid">
              
              <div style={{ display: 'flex', flexDirection: 'column', gap: '1.25rem' }}>

                <div className="card" style={{ display: 'flex', alignItems: 'center', gap: '1rem', padding: '1.25rem' }}>
                  <div style={{ width: '40px', height: '40px', borderRadius: '8px', backgroundColor: 'var(--primary-light)', color: 'var(--primary)', display: 'flex', alignItems: 'center', justifyContent: 'center', fontSize: '1.2rem' }}>📧</div>
                  <div>
                    <div style={{ fontSize: '0.8rem', color: 'var(--text-muted)' }}>Email</div>
                    <a href="mailto:dillibabu22032005@gmail.com" style={{ fontSize: '0.92rem', fontWeight: 600, color: 'var(--text-primary)' }}>dillibabu22032005@gmail.com</a>
                  </div>
                </div>
                <div className="card" style={{ display: 'flex', alignItems: 'center', gap: '1rem', padding: '1.25rem' }}>
                  <div style={{ width: '40px', height: '40px', borderRadius: '8px', backgroundColor: 'var(--primary-light)', color: 'var(--primary)', display: 'flex', alignItems: 'center', justifyContent: 'center', fontSize: '1.2rem' }}>📞</div>
                  <div>
                    <div style={{ fontSize: '0.8rem', color: 'var(--text-muted)' }}>Phone</div>
                    <a href="tel:+919841494347" style={{ fontSize: '0.92rem', fontWeight: 600, color: 'var(--text-primary)' }}>+91 98414 94347</a>
                  </div>
                </div>
                <div className="card" style={{ display: 'flex', alignItems: 'center', gap: '1rem', padding: '1.25rem' }}>
                  <div style={{ width: '40px', height: '40px', borderRadius: '8px', backgroundColor: 'var(--primary-light)', color: 'var(--primary)', display: 'flex', alignItems: 'center', justifyContent: 'center', fontSize: '1.2rem' }}>📍</div>
                  <div>
                    <div style={{ fontSize: '0.8rem', color: 'var(--text-muted)' }}>Location</div>
                    <div style={{ fontSize: '0.92rem', fontWeight: 600, color: 'var(--text-primary)' }}>Madhavaram, Chennai, India</div>
                  </div>
                </div>
              </div>

              <div className="card" style={{ padding: '2.5rem' }}>
                <h3 style={{ fontSize: '1.25rem', fontWeight: 700, marginBottom: '1.5rem', color: 'var(--text-primary)' }}>Send a Message</h3>
                {submitStatus === 'success' && (
                  <div style={{ backgroundColor: 'rgba(16, 185, 129, 0.1)', color: '#10b981', padding: '0.8rem 1rem', borderRadius: 'var(--border-radius-sm)', border: '1px solid rgba(16, 185, 129, 0.2)', fontSize: '0.9rem', marginBottom: '1.5rem' }}>
                    ✓ Message sent successfully!
                  </div>
                )}

                <form onSubmit={handleSubmit} style={{ display: 'flex', flexDirection: 'column', gap: '1.2rem' }}>
                  <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: '1rem' }} className="form-row">
                    <div>
                      <input type="text" placeholder="Name" name="name" value={formData.name} onChange={handleChange} style={{ width: '100%', padding: '0.75rem 1rem', borderRadius: 'var(--border-radius-sm)', border: '1px solid var(--border-color)', backgroundColor: 'var(--bg-app)' }} />
                      {errors.name && <span style={{ color: '#ef4444', fontSize: '0.75rem' }}>{errors.name}</span>}
                    </div>
                    <div>
                      <input type="email" placeholder="Email" name="email" value={formData.email} onChange={handleChange} style={{ width: '100%', padding: '0.75rem 1rem', borderRadius: 'var(--border-radius-sm)', border: '1px solid var(--border-color)', backgroundColor: 'var(--bg-app)' }} />

                  <div>
                    <textarea placeholder="Message" name="message" rows="4" value={formData.message} onChange={handleChange} style={{ width: '100%', padding: '0.75rem 1rem', borderRadius: 'var(--border-radius-sm)', border: '1px solid var(--border-color)', backgroundColor: 'var(--bg-app)' }} />
                    {errors.message && <span style={{ color: '#ef4444', fontSize: '0.75rem' }}>{errors.message}</span>}
                  </div>
                  <button type="submit" disabled={isSubmitting} className="btn btn-primary" style={{ alignSelf: 'flex-start' }}>
                    {isSubmitting ? 'Sending...' : 'Send Message'}
                  </button>
                </form>
              </div>

            </div>
          </div>
          <style>{`
            @media (max-width: 900px) { .contact-grid { grid-template-columns: 1fr !important; gap: 2.5rem !important; } }
            @media (max-width: 500px) { .form-row { grid-template-columns: 1fr !important; } }
          `}</style>
        </section>
      );
    }

    // ==========================================
    // MAIN APP COORDINATOR
    // ==========================================
    function App() {
      const [theme, setTheme] = React.useState('light');
      const [activeSection, setActiveSection] = React.useState('hero');

      const toggleTheme = () => {
        const nextTheme = theme === 'light' ? 'dark' : 'light';
        setTheme(nextTheme);
        document.documentElement.setAttribute('data-theme', nextTheme);
      };

      React.useEffect(() => {
        const sections = ['hero', 'about', 'skills', 'experience', 'projects', 'certifications', 'achievements', 'contact'];
        
        const observerOptions = {
          root: null,
          rootMargin: '-30% 0px -60% 0px',
          threshold: 0,
        };

        const observerCallback = (entries) => {
          entries.forEach((entry) => {
            if (entry.isIntersecting) {
              setActiveSection(entry.target.id);
            }
          });
        };

        const observer = new IntersectionObserver(observerCallback, observerOptions);
        sections.forEach((id) => {
          const el = document.getElementById(id);
          if (el) observer.observe(el);
        });

        return () => {
          sections.forEach((id) => {
            const el = document.getElementById(id);
            if (el) observer.unobserve(el);
          });
        };
      }, []);

      return (
        <div style={{ minHeight: '100vh', display: 'flex', flexDirection: 'column' }}>
          <Navbar theme={theme} toggleTheme={toggleTheme} activeSection={activeSection} />
          <main style={{ flexGrow: 1 }}>
            <Hero />
            <About />
            <Skills />
            <Experience />
            <Projects />
            <Certifications />
            <Achievements />
            <Contact />
          </main>
          <footer style={{ backgroundColor: 'var(--bg-card)', borderTop: '1px solid var(--border-color)', padding: '2rem 1.5rem', textAlign: 'center', fontSize: '0.85rem', color: 'var(--text-muted)' }}>
            <div className="container" style={{ display: 'flex', flexDirection: 'column', alignItems: 'center', gap: '0.5rem' }}>
              <p style={{ fontWeight: 600, color: 'var(--text-primary)' }}>Dilli Babu A &bull; Electronics Engineer &amp; Developer</p>
              <p>&copy; {new Date().getFullYear()} All rights reserved. React JS Standing Edition.</p>
            </div>
          </footer>
        </div>
      );
    }

    // Mount to root DOM node
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
